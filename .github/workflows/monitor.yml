name: Motorna production monitoring
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motorna-production-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: .monitor-state/state.json
          key: motorna-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: motorna-monitor-state-
      - name: Read-only production checks and Telegram alert
        env:
          MOTORNA_TELEGRAM_ALERTS_ENABLED: ${{ vars.MOTORNA_TELEGRAM_ALERTS_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor-production.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .monitor-state/state.json
          key: motorna-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-health
          path: .monitor-state/report.json
          retention-days: 14
